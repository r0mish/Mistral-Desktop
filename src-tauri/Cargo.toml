[package]
name = "mistral-desktop"
version = "0.1.0"
description = "Client de bureau léger et respectueux de la vie privée pour l'API Mistral AI"
authors = ["r0mish"]
license = "MIT"
edition = "2021"
rust-version = "1.90"

[lib]
name = "mistral_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "http2", "charset"] }
tokio = { version = "1", features = ["sync", "macros"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
