name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
      - name: Dépendances système (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libasound2-dev
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run build
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      # Sous Windows, inclut l'exécution réelle de commandes via Git Bash, pwsh et PowerShell 5.1.
      - run: cargo test
        working-directory: src-tauri

  # Application réelle (Rust + WebView) pilotée par WebDriver contre un faux serveur Mistral,
  # et SSH par mot de passe / code 2FA contre de vrais sshd locaux (machine jetable du CI).
  e2e:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libasound2-dev webkit2gtk-driver xvfb \
            openssh-server libpam-google-authenticator gnome-keyring dbus-x11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: e2e
      - run: cargo install tauri-driver --locked
      - run: npm ci
      - run: npx tauri build --debug --no-bundle
      - name: Serveurs SSH de test
        run: sudo sh e2e/ssh-servers.sh
      - name: Tests de bout en bout
        env:
          E2E_SSH_USER: mdtest
          E2E_SSH_PASSWORD: Secret-123
          E2E_SSH_PASSWORD_PORT: "2223"
          E2E_SSH_2FA_PORT: "2224"
          E2E_SSH_TOTP_SECRET: JBSWY3DPEHPK3PXP
          E2E_KEYRING: "1"
        # Sortie dans un fichier : le démon du trousseau reste attaché aux descripteurs hérités.
        run: |
          status=0
          xvfb-run -a dbus-run-session -- e2e/with-keyring.sh npm run test:e2e > e2e.log 2>&1 < /dev/null || status=$?
          grep -vE "dbind-WARNING|portal|libEGL|^\s*$" e2e.log || true
          exit $status
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-captures
          path: e2e/artifacts/
          if-no-files-found: ignore
